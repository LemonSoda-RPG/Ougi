name: Validate registry

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 registry.json 是否符合规范
        run: |
          python3 --version
          python3 tools/validate_registry.py

      # 用上游权威生成器再生成一次，确认 registry.json 与 artifacts 没有漂移。
      # 固定到具体提交，避免上游改动导致 CI 行为漂移。
      - name: 确认 registry.json 与 artifacts 一致
        env:
          GENERATOR_REF: db3106900d90e07f5723da9ed933cc0399a5670d
        run: |
          curl -fsSL -o /tmp/generate_registry.pl \
            "https://raw.githubusercontent.com/Difegue/LANraragi/${GENERATOR_REF}/tools/generate_registry.pl"
          cp registry.json /tmp/committed.json
          perl /tmp/generate_registry.pl .
          python3 - <<'PY'
          import json, sys
          committed = json.load(open('/tmp/committed.json', encoding='utf-8'))
          regenerated = json.load(open('registry.json', encoding='utf-8'))
          # generated_at 每次生成都会刷新，只比插件部分
          if committed.get('plugins') != regenerated.get('plugins'):
              print('❌ registry.json 与 artifacts 不一致。')
              print('   请在仓库根目录运行上游生成器后提交：')
              print('   perl tools/generate_registry.pl .')
              sys.exit(1)
          print('✅ registry.json 与 artifacts 一致')
          PY
